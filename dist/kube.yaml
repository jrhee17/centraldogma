apiVersion: v1
kind: Service
metadata:
  name: cd-hs
  labels:
    app: cd
spec:
  type: NodePort
  ports:
    - port: 36462
      name: server
    - port: 36463
      name: quorum
    - port: 36464
      name: election
#  clusterIP: None
  selector:
    app: cd
---
apiVersion: v1
kind: Service
metadata:
  name: cd-cs
  labels:
    app: cd
spec:
  ports:
    - port: 2181
      name: client
  selector:
    app: cd
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cd-pdb
spec:
  selector:
    matchLabels:
      app: cd
  maxUnavailable: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cd
spec:
  selector:
    matchLabels:
      app: cd
  serviceName: cd-hs
  replicas: 3
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: OrderedReady
  template:
    metadata:
      labels:
        app: cd
    spec:
      containers:
        - name: kubernetes-zookeeper
          imagePullPolicy: Never
          image: "centraldogma:latest"
          resources:
            requests:
              memory: "1Gi"
              cpu: "0.5"
          ports:
            - containerPort: 36462
              name: server
            - containerPort: 36463
              name: quorum
            - containerPort: 36464
              name: election